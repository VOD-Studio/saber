name: CI / CD

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  lint:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Check code formatting
        run: make fmt-check
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run tests
        run: make test
      - name: Check coverage
        run: make test-cover-check

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build binary
        run: make build

  release:
    name: Build & Publish Release
    needs: [lint, test, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Validate version and extract release notes
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          makefile = Path("Makefile").read_text(encoding="utf-8")
          if not re.search(rf"^VERSION := {re.escape(version)}$", makefile, re.MULTILINE):
              raise SystemExit(f"Makefile VERSION 与标签 v{version} 不一致")

          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(rf"^## \[{re.escape(version)}\](?:[ \t]+-[ \t]+[^\n]+)?$", changelog, re.MULTILINE)
          if not match:
              raise SystemExit(f"CHANGELOG.md 缺少 {version} 的发布说明")
          remaining = changelog[match.end():]
          next_heading = re.search(r"^## ", remaining, re.MULTILINE)
          notes = remaining[:next_heading.start() if next_heading else None].strip()
          if not notes:
              raise SystemExit(f"CHANGELOG.md 中 {version} 的发布说明为空")
          Path("RELEASE_NOTES.md").write_text(notes + "\n", encoding="utf-8")
          PY
      - name: Build all platform release binaries
        run: |
          VERSION="${GITHUB_REF_NAME#v}" make build-all
          (cd bin/release && sha256sum saber-* > SHA256SUMS)
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          files: bin/release/*
          fail_on_unmatched_files: true
